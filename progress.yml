# ---------------------------------------------------------------- reading list
# Set done: true when you finish an item.
readings:
  instructor:
    - title: Extending RISC-V ISA With a Custom Instruction Set Extension
      url: https://www.design-reuse.com/article/61135-extending-risc-v-isa-with-a-custom-instruction-set-extension/
      kind: Codasip whitepaper, 2019
      priority: Read first
      done: false
      note: Full flow for one new instruction - hot spot, encoding, ALU change, C access, verification. Copy its library pattern (hardware instruction with a plain C fallback).
    - title: Modular Processor Architecture with Cryptography ISA Extensions
      url: https://ieeexplore.ieee.org/document/10198046
      kind: O. Ganon, I. Levi - IEEE NEWCAS 2023
      priority: Read closely
      done: false
      note: Written by our supervisor. A tiny RISC core extended with low-cost crypto instructions; likely the template for this project. Get the PDF through TAU's IEEE access.
    - title: Vectorized Nonlinear Functions with the RISC-V Vector Extension
      url: https://ieeexplore.ieee.org/document/10461486/
      kind: Bavier et al. (SiFive) - IEEE ARITH 2023
      priority: Skim for the math
      done: false
      note: The software side of the same problem - fast exp and tanh on RISC-V. Useful for range reduction and polynomial approximation.
    - title: "Digital Systems: From Logic Gates to Processors"
      url: https://www.coursera.org/learn/digital-systems
      kind: Coursera, UAB - 11 modules
      priority: Optional review
      done: false
      note: Mostly review after Logic Design; the simple-processor modules are the useful part. Uses VHDL.
    - title: "#1 - Introduction to FPGA and Verilog"
      url: https://www.youtube.com/watch?v=yvqkg44_DQA
      kind: YouTube
      priority: As needed
      done: false
      note: Fills gaps in the FPGA tool flow.
    - title: 4. Assembly Language & Computer Architecture
      url: https://www.youtube.com/watch?v=L1ung0wil9Y
      kind: YouTube lecture
      priority: Recommended
      done: false
      note: How C becomes assembly and flows through a pipeline. Background for reading compiled benchmarks and counting cycles.

  added:
    - title: CFU Playground (paper)
      url: https://arxiv.org/pdf/2201.01863
      kind: Google, Harvard, Purdue
      priority: Read first
      done: false
      note: Almost our exact project, open source - a RISC-V soft core on FPGA with custom function units for TinyML. Code at github.com/google/CFU-Playground
    - title: NEORV32 processor and Custom Functions Unit
      url: https://github.com/stnolting/neorv32
      kind: Open-source RISC-V core
      priority: High
      done: false
      note: Clean reference for custom opcodes, multi-cycle units and C intrinsics, and for when to use a memory-mapped accelerator instead.
    - title: Sigmoid approximations on FPGA (PLAN, A-law and others)
      url: https://users.utcluj.ro/~atn/papers/ATN_2_2009_4.pdf
      kind: Paper
      priority: High
      done: false
      note: Compares sigmoid approximations by FPGA resources and error. A model for our own comparison table.
    - title: Sigmoid with curvature-based piecewise linear fitting
      url: https://www.mdpi.com/2079-9292/11/9/1365
      kind: MDPI Electronics, 2022
      priority: Medium
      done: false
      note: Surveys LUT, CORDIC, Taylor, polynomial and piecewise methods, and shows how to choose segment boundaries.
    - title: Fixed-point tanh with lookup tables on FPGA
      url: https://easychair.org/publications/preprint/CWMs
      kind: EasyChair preprint
      priority: Medium
      done: false
      note: How bit width affects LUT-based tanh accuracy, area and power. Helps choose the Q format.
    - title: "I-BERT: Integer-only BERT Quantization"
      url: https://arxiv.org/abs/2101.01321
      kind: Paper (Softmax and GELU sections)
      priority: High for Softmax
      done: false
      note: Integer-only exp - range reduction to (-ln 2, 0] plus a 2nd-order polynomial.
    - title: Hardware Implementation of Multi-Rate Input SoftMax
      url: https://scholarworks.boisestate.edu/electrical_facpubs/550
      kind: MWSCAS 2021
      priority: Medium
      done: false
      note: A small Softmax unit - ROM for exp, CORDIC reciprocal, pipelined.
    - title: Hardware-oriented Softmax and RMSNorm approximations
      url: https://www.mdpi.com/2072-666X/17/1/84
      kind: Micromachines, 2025
      priority: Optional
      done: false
      note: Fully fixed-point Softmax with an exp built from LUTs and one adder, no DSPs.
    - title: Automatic custom instruction design for RISC-V (CIDRE)
      url: https://arxiv.org/abs/2509.15782v1
      kind: Paper
      priority: Optional
      done: false
      note: Estimating a custom instruction's gain and critical-path impact before building it.
    - title: RISC-V Unprivileged ISA specification
      url: https://riscv.org/specifications/
      kind: Reference
      priority: Reference
      done: false
      note: Base instruction formats, R-type encoding, and the custom-0 / custom-1 opcode space.

